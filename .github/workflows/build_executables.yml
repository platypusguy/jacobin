name: Build executables

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (blank = build only, from the selected branch)'
        required: false
        type: string

jobs:

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Validate tag exists
      if: inputs.tag != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1 \
          || { echo "::error::Tag '$TAG' does not exist in ${{ github.repository }}"; exit 1; }

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            exe: jacobin-macos-arm64
          - os: ubuntu-latest
            exe: jacobin-ubuntu-amd64
          - os: windows-latest
            exe: jacobin-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}   # empty string = the branch selected in the UI

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        cache: true
        cache-dependency-path: "**/go.sum"

    - name: Build Jacobin
      shell: bash
      run: |
        mkdir -p dist
        cd src
        go build -o "../dist/${{ matrix.exe }}" .
        cd ../dist
        if [[ "$RUNNER_OS" != "Windows" ]]; then
            tar -czf "${{ matrix.exe }}.tar.gz" "${{ matrix.exe }}"
            rm "${{ matrix.exe }}"
        fi
        ls -l

    - name: Upload per-OS executable
      uses: actions/upload-artifact@v4
      with:
        name: stage-${{ matrix.os }}
        path: dist/${{ matrix.exe }}*
        if-no-files-found: error
        retention-days: 1

  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all executables into one directory
      uses: actions/download-artifact@v4
      with:
        pattern: stage-*
        path: dist
        merge-multiple: true

    - name: List output directory
      run: ls -l dist

    - name: Upload combined artifact
      uses: actions/upload-artifact@v4
      with:
        name: jacobin-executables
        path: dist/
        if-no-files-found: error
        retention-days: 3

  release:
    if: inputs.tag != ''
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to create/modify releases
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
    - name: Download combined executables
      uses: actions/download-artifact@v4
      with:
        name: jacobin-executables
        path: dist

    - name: Create release if it doesn't exist
      run: |
        gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

    - name: Attach executables to release
      run: gh release upload "$TAG" dist/* --clobber
